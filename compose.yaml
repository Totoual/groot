services:
  groot-mcp:
    build:
      context: .
      args:
        GO_VERSION: "1.25.4"
    image: groot-mcp:local
    command: ["mcp", "--http", "--listen", "0.0.0.0:8080", "--endpoint", "/mcp", "--project", "/workspace"]
    environment:
      GROOT_HOME: /var/lib/groot
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - groot-state:/var/lib/groot
      - .:/workspace
    working_dir: /workspace

volumes:
  groot-state:
