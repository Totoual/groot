name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run test suite
        run: bash scripts/test.sh

  docker-mcp-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build MCP HTTP image
        run: docker compose build

      - name: Start MCP HTTP server
        run: docker compose up -d

      - name: Verify MCP initialize over HTTP
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | grep '"protocolVersion":"2025-06-18"'

      - name: Verify MCP notification over HTTP
        run: |
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -X POST http://127.0.0.1:8080/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          )"
          test "$status" = "202"

      - name: Stop MCP HTTP server
        if: always()
        run: docker compose down --volumes
